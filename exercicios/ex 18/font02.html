<!DOCTYPE html>
<html lang="pt-br
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
   @font-face {
   font-family: 'Love'; 
   /* URLs separadas por vírgula. O ; encerra a propriedade src. */
   src: url('fonts/love larry.ttf') format('opentype'), 
        url('fonts/love larry.ttf') format('truetype');
   
   font-weight: normal;
   font-style: normal;
}
   /* Tipos de format ()
   - opentype (otf)
   -truetype ()
   -entedded-opentype ()
   -truetype-aat (apple advanced typography)
   - svg
   */


        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'love larry', Times, serif;
            font-size: 3em ;
            font-weight: normal;
        }
    </style>
</head>
