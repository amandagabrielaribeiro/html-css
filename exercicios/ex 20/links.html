<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
     /* Seletores personalisados
     # = id
     . = class
     : = pseudo- class
     :: = pseudo-element
     >  = children 
     */
     
     
     body {
        font-family: Arial, Helvetica, sans-serif;
        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited {
            color: darkred;
        }
        a:hover {
            color: black;
            text-decoration: underline;
        }
        a:active {
            color: yellow;
        }
        .especial {
            background-color: rgba(231, 54, 54, 0.966);
          

        }
        a::before {
            content: "→"; 
        }
        .especial::before {
            content: "→" ;
        }
        .especial::after {
            content: "←";
        }
        a::after {
            content:"←" ;
            
           
        }
     }   
    </style>
</head>
<body>
    <h1>Personalisando Links</h1>
    <ul>
        <li> <a href="https://gustavoguanabara.github.io/" target="_blank">Repositorio Github</a> </li>
        <li>  <a href="https://www.youtube.com/watch?v=vMlrcOVr7po" class="especial">Canal do youtube</a></li>
        <li><a href="https://www.cursoemvideo.com/" target="_blank">Site do Curso em video</a> </li>
    </ul>   
</body>
</html>
