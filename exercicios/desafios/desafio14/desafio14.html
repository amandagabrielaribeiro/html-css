

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio tabelas</title>

    <style>
body {
    font-family: Arial, Helvetica, sans-serif;
    padding: 20px;
}


table {
 border-collapse: collapse;   
 width:500px ;


}



th , td{
border: 1px solid black;
padding: 10px;

text-align: center;

}

tbody th, .humanas , .media{

    background-color:grey;
    color: black;
    font-weight: bold;
}

th, head {
background-color: grey;
color: white;

}

.exata, .saber {
background-color: white;
color:black;

}

    </style>
</head>
<body>
  
 <thead>
      <table >
    <tr>
        <th rowspan="2">Área</th>
        <th rowspan="2">Disciplinas</th>
        <th colspan="2">Notas</th>
        <th rowspan="2">Média</th>

    </tr>

    <tr>
        <th>Nota 1</th>
        <th>Nota 2 </th>

    </tr>




 </thead>

 <tbody>
<tr>
    <th class="exata"  rowspan="4">Exatas</th>
    <td>Matemática</td>
    <td>0.0</td>
    <td>0.0</td>
    <td>0.0</td>

</tr>

<tr>
<td>Física</td>
<td>0.0</td>
<td>0.0</td>
<td>0.0</td>


</tr>

<tr>
    <td>Química</td>
    <td>0.0</td>
    <td>0.0</td>
    <td>0.0</td>

</tr>

<tr>
    <td>Biologia</td>
    <td>0.0</td>
    <td>0.0</td>
    <td>0.0</td>


</tr>

<tr class="media">
<th colspan="4">Média de exatas</th>
<td>0.0</td>
</tr>

<tr>
    <th class="saber" rowspan="2">Humanas</th>
    <td>História</td>
    <td>0.0</td>
    <td>0.0</td>
    <td>0.0</td>


</tr>
<tr>
<td>Geografia</td>
<td>0.0</td>
<td>0.0</td>
<td>0.0</td>
</tr>
<tr>

    <tr class="humanas">
    <td colspan="4">Média de Humanas</td>
    <td>0.0</td>
</tr>

 </tbody>
 </table>
</body>
</html>
